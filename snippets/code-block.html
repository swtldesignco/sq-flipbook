<!-- sq-flipbook — paste into ONE Code Block where the booklet should appear.
     1. Upload the PDF to the site (any link → File → upload) and copy its /s/ path.
     2. Replace data-pdf below. Paths are case-sensitive.
     3. Delete any option line you don't need; defaults are shown. -->
<div class="sq-flipbook"
     data-pdf="/s/your-file.pdf"
     data-max-width=""
     data-max-height=""
     data-align="center"
     data-mobile-arrows="true"
     data-links="true"
     data-fullscreen="true"
     data-download="true"
     data-accent=""
     data-shadow="0.5"
     data-speed="700"
     data-scale="1.5"></div>
<script src="https://cdn.jsdelivr.net/gh/swtldesignco/sq-flipbook@1/sq-flipbook.js" defer></script>
